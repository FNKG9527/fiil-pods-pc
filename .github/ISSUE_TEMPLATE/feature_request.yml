name: 功能建议
description: 想要新功能或改进
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到什么问题
      description: 先说场景，再说你想要什么功能。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望怎么做
    validations:
      required: false

  - type: dropdown
    id: verified
    attributes:
      label: 这个功能在耳机上验证过吗
      description: |
        本仓库只做**已验证**的功能。没验证的只能进「原始 Hex 控制台」。
      options:
        - 已验证可用（有抓包证据）
        - 知道能做但没验证
        - 完全不确定
    validations:
      required: true
